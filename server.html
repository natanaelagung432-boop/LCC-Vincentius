<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>LCC Bell — Server</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<style>

.live-token-box{
  text-align:center;
  padding:20px;
  border-radius:18px;
  background:#eef2ff;
  margin-top:15px;
}

.live-token{
  font-size:32px;
  font-weight:1000;
  letter-spacing:4px;
  margin:15px 0;
  word-break:break-all;
}

.token-buttons{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.token-buttons button{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  font-weight:900;
  cursor:pointer;
}

.btn-token{
  background:#2563eb;
  color:white;
}

.btn-copy{
  background:#16a34a;
  color:white;
}

.token-note{
  color:#64748b;
  font-size:13px;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="app">

  <div class="top">

    <div>
      <h1>🔔 LCC BELL</h1>
      <div class="sub">SERVER / JURI</div>
    </div>

    <a class="back" href="index.html">← Menu</a>

  </div>


  <div id="status" class="status">
    MENGHUBUNGKAN...
  </div>


  <!-- KONTROL -->

  <div class="panel">

    <div class="controls">

      <button id="arm" class="btn arm">
        SIAPKAN BELL
      </button>

      <button id="reset" class="btn reset">
        RESET SOAL
      </button>

    </div>

    <div id="winner" class="message"></div>

    <div id="connection" class="connection">
      Menghubungkan Firebase...
    </div>

  </div>


  <!-- TOKEN LIVE -->

  <div class="panel">

    <h2>📺 TOKEN LIVE</h2>

    <div class="live-token-box">

      <div>
        Gunakan token ini pada perangkat/TV
        yang digunakan untuk menampilkan LIVE.
      </div>

      <div id="liveToken" class="live-token">
        ------
      </div>

      <div class="token-buttons">

        <button
          id="generateToken"
          class="btn-token">
          BUAT TOKEN LIVE
        </button>

        <button
          id="copyToken"
          class="btn-copy">
          SALIN TOKEN
        </button>

      </div>

      <div class="token-note">
        Token tetap sama sampai panitia membuat token baru.
      </div>

    </div>

  </div>


  <!-- PESERTA -->

  <div class="panel">

    <h2>Peserta</h2>

    <div id="players" class="players"></div>

  </div>

</div>


<script>

if(!window.db){

  document.body.innerHTML = `
    <div class="app">
      <div class="panel">
        <h2>Firebase belum dikonfigurasi</h2>

        <p>
          Isi <b>firebase-config.js</b>
          dengan konfigurasi Web App Firebase Anda.
        </p>

        <p>
          Pastikan Realtime Database sudah dibuat.
        </p>

      </div>
    </div>
  `;

  throw new Error(
    "Firebase configuration belum diisi."
  );
}


const room =
  db.ref("lcc/current");


const defaultState = {

  status:"waiting",

  winner:null,

  winnerTime:null,

  participantCount:12,

  roundId:null,

  timerStartAt:null,

  timerDuration:5,

  liveToken:null

};


let lastWinner = null;

let audioCtx = null;


/* =========================
   AUDIO
========================= */

function unlockAudio(){

  try{

    const C =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!C)return;

    audioCtx =
      audioCtx || new C();

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

  }catch(e){}

}


function bell(){

  try{

    const C =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!C)return;

    audioCtx =
      audioCtx || new C();

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    const now =
      audioCtx.currentTime;

    const gain =
      audioCtx.createGain();

    const o1 =
      audioCtx.createOscillator();

    const o2 =
      audioCtx.createOscillator();

    o1.type="sine";
    o2.type="sine";

    o1.frequency.setValueAtTime(
      880,
      now
    );

    o2.frequency.setValueAtTime(
      660,
      now
    );

    gain.gain.setValueAtTime(
      .001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .7,
      now+.01
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      now+.65
    );

    o1.connect(gain);
    o2.connect(gain);

    gain.connect(
      audioCtx.destination
    );

    o1.start(now);
    o2.start(now);

    o1.stop(now+.7);
    o2.stop(now+.7);

  }catch(e){}

}


/* =========================
   TOKEN LIVE
========================= */

function makeToken(){

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let token="";

  for(let i=0;i<8;i++){

    token +=
      chars.charAt(
        Math.floor(
          Math.random()*chars.length
        )
      );

  }

  return token;

}


function showToken(token){

  document.getElementById(
    "liveToken"
  ).textContent =
    token || "------";

}


async function generateLiveToken(){

  unlockAudio();

  const token =
    makeToken();

  try{

    await room.update({
      liveToken:token
    });

    showToken(token);

  }catch(e){

    document.getElementById(
      "connection"
    ).textContent =
      "✕ Gagal membuat token: "+
      e.message;

  }

}


async function copyLiveToken(){

  const token =
    document.getElementById(
      "liveToken"
    ).textContent.trim();

  if(!token || token==="------"){
    alert("Belum ada Token LIVE.");
    return;
  }

  try{

    await navigator.clipboard.writeText(
      token
    );

    document.getElementById(
      "copyToken"
    ).textContent =
      "✓ TERSALIN";

    setTimeout(()=>{

      document.getElementById(
        "copyToken"
      ).textContent =
        "SALIN TOKEN";

    },1500);

  }catch(e){

    prompt(
      "Salin Token LIVE:",
      token
    );

  }

}


document.getElementById(
  "generateToken"
).onclick =
  generateLiveToken;


document.getElementById(
  "copyToken"
).onclick =
  copyLiveToken;


/* =========================
   RENDER
========================= */

function render(raw){

  const s =
    Object.assign(
      {},
      defaultState,
      raw || {}
    );


  const st =
    document.getElementById(
      "status"
    );


  if(s.status==="armed"){

    st.textContent =
      "🟢 BELL AKTIF — TUNGGU TEKANAN";

    st.className =
      "status armed";

  }else if(s.status==="locked"){

    st.textContent =
      "🔔 TERKUNCI — PESERTA "+
      s.winner+
      " MENANG";

    st.className =
      "status locked";

  }else{

    st.textContent =
      "MENUNGGU — tekan SIAPKAN BELL";

    st.className =
      "status";

  }


  document.getElementById(
    "winner"
  ).textContent =

    s.winner

      ? "🏆 PEMENANG: PESERTA "+
        s.winner

      : "";


  showToken(
    s.liveToken
  );


  /* =========================
     PESERTA
  ========================= */

  const grid =
    document.getElementById(
      "players"
    );

  grid.innerHTML="";


  const players =
    s.players || {};


  const keys =
    Object.keys(players);


  let count =
    Number(s.participantCount);


  if(!count || count<1){

    count =
      keys.length || 12;

  }


  for(let i=1;i<=count;i++){

    const player =
      keys
        .map(k=>players[k])
        .find(
          p =>
            Number(p?.number)===i
        );


    const e =
      document.createElement("div");


    const banned =
      !!player?.banned;


    const winner =
      Number(s.winner)===i;


    e.className =
      "player"+
      (winner ? " winner" : "")+
      (banned ? " banned" : "");


    if(banned){

      e.innerHTML =
        "<div>"+i+"</div>"+
        "<small>BANNED</small>";

    }else if(winner){

      e.innerHTML =
        "<div>"+i+"</div>"+
        "<small>🏆 PEMENANG</small>";

    }else{

      e.innerHTML =
        "<div>"+i+"</div>"+
        "<small>PESERTA</small>";

    }


    grid.appendChild(e);

  }


  if(
    s.winner &&
    s.winner!==lastWinner
  ){

    bell();

    lastWinner =
      s.winner;

  }


  if(!s.winner){

    lastWinner=null;

  }

}


/* =========================
   FIREBASE
========================= */

room.on(
  "value",

  snap=>{

    render(
      snap.val()
    );

    document.getElementById(
      "connection"
    ).textContent =
      "● Firebase terhubung";

  },

  err=>{

    document.getElementById(
      "connection"
    ).textContent =
      "✕ Firebase gagal: "+
      err.message;

  }

);


/* =========================
   SIAPKAN BELL
========================= */

document.getElementById(
  "arm"
).onclick = async()=>{

  unlockAudio();

  try{

    await room.transaction(
      current=>{

        const s =
          Object.assign(
            {},
            defaultState,
            current || {}
          );


        const players =
          s.players || {};


        return {

          ...s,

          status:"armed",

          winner:null,

          winnerTime:null,

          timerStartAt:null,

          roundId:
            Date.now().toString(),

          players:players

        };

      }
    );

  }catch(e){

    document.getElementById(
      "connection"
    ).textContent =
      "✕ Gagal menyimpan: "+
      e.message;

  }

};


/* =========================
   RESET SOAL
========================= */

document.getElementById(
  "reset"
).onclick = async()=>{

  unlockAudio();

  try{

    await room.transaction(
      current=>{

        const s =
          Object.assign(
            {},
            defaultState,
            current || {}
          );


        const players =
          {...(s.players || {})};


        Object.keys(players)
          .forEach(token=>{

            players[token] = {

              ...players[token],

              violationCount:0,

              banned:false

            };

          });


        return {

          ...s,

          status:"waiting",

          winner:null,

          winnerTime:null,

          timerStartAt:null,

          roundId:
            Date.now().toString(),

          players:players

        };

      }
    );

  }catch(e){

    document.getElementById(
      "connection"
    ).textContent =
      "✕ Gagal reset: "+
      e.message;

  }

};


/* =========================
   INIT
========================= */

render(
  defaultState
);

</script>

</body>
</html>
